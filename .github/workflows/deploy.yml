name: Build & Deploy to cPanel

on:
  push:
    branches:
      - main

# Least privilege: the job only needs to read the repo.
permissions:
  contents: read

# Never run two deploys at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fail on known high/critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Build static site
        run: npm run build # static export -> ./out (+ CSP hashes and .htaccess)

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.CPANEL_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        # Host key comes from known_hosts above; don't disable host-key checking.
        run: ssh ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }} "echo 'SSH Connection Successful'"

      - name: Deploy build to cPanel
        run: |
          rsync -avz --delete \
          ./out/ ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:/home/${{ secrets.CPANEL_USER }}/public_html/
