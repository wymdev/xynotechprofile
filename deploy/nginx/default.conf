# XynoTech static site — hardened nginx config (Docker / Coolify).
# This file is included inside nginx's http {} block (conf.d/*.conf).

# ---------- real client IP behind Coolify's Traefik proxy ----------
# Without this every visitor would appear as the proxy's IP and share one rate limit.
# If you put Cloudflare in front, also trust Cloudflare's ranges and use CF-Connecting-IP.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ---------- rate limiting (per client IP) ----------
# A full page load is ~30 requests; burst covers that, sustained floods get 429.
limit_req_zone  $binary_remote_addr zone=req_per_ip:10m  rate=15r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status  429;
limit_conn_status 429;

# ---------- scraper / AI crawler / attack-tool blocking ----------
map $http_user_agent $bad_agent {
    default 0;
    ""      1;  # empty user agent
    "~*(GPTBot|ChatGPT-User|OAI-SearchBot|CCBot|ClaudeBot|Claude-Web|anthropic-ai|Bytespider|Amazonbot|PerplexityBot|Google-Extended|Applebot-Extended|meta-externalagent|FacebookBot|Diffbot|ImagesiftBot|Omgilibot|cohere-ai|PetalBot|DataForSeoBot|AhrefsBot|SemrushBot|MJ12bot|DotBot|BLEXBot|MegaIndex|Scrapy|python-requests|python-urllib|aiohttp|httpx|Go-http-client|node-fetch|axios|libwww-perl|HTTrack|curl|Wget|zgrab|masscan|nikto|sqlmap|nmap)" 1;
}
# Health checks run inside the container (wget/curl from localhost) — never block those.
geo $is_local {
    default   0;
    127.0.0.1 1;
    ::1       1;
}
map "$is_local:$bad_agent" $block_agent {
    default 0;
    "0:1"   1;
}

server {
    # 80 is the standard port; 3000 is Coolify's default "Ports Exposes" for Node apps,
    # so either setting reaches the site (avoids 502 Bad Gateway from a port mismatch).
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;   # hide nginx version
    autoindex off;       # no directory listings

    # ---- slow-client / flood protection ----
    client_max_body_size 1k;          # static site: nothing to upload
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    keepalive_requests 200;
    large_client_header_buffers 4 8k;
    limit_req  zone=req_per_ip burst=60 nodelay;
    limit_conn conn_per_ip 40;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    if ($block_agent) { return 403; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Never serve hidden files (.git, .env, .htaccess …); allow /.well-known (security.txt)
    location ^~ /.well-known/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }
    location ~ /\. {
        return 404;
    }

    # Hashed build assets never change: cache for a year.
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Pages: always revalidate so a new deploy shows up immediately.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }
}
