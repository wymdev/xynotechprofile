# Included in every location (add_header in a location replaces server-level headers).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy $corp always;  # see map in default.conf
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Robots-Tag "noai, noimageai" always;
# Strict CSP with hashes of the site's inline scripts — generated at build time.
include /etc/nginx/snippets/csp.conf;
